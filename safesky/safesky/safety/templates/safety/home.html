{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Safety App - Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #111, #000);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem; /* increased from 2.5rem */
            margin-bottom: 60px;
            color: #00e5ff;
            text-shadow: 0 0 15px #00e5ff, 0 0 30px rgba(0,229,255,0.6);
            letter-spacing: 3px;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            from { text-shadow: 0 0 10px #00e5ff; }
            to { text-shadow: 0 0 40px #00e5ff, 0 0 60px rgba(0,229,255,0.8); }
        }

        .tab-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 85%;
            max-width: 400px;
        }

        a {
            text-decoration: none;
        }

        .tab-btn {
            border: none;
            border-radius: 16px;
            padding: 22px;
            font-size: 22px; /* increased from 18px */
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255,255,255,0.1);
        }

        .tab-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.15);
            transform: rotate(45deg);
            z-index: 0;
            transition: 0.6s;
        }

        .tab-btn:hover::before {
            top: -20%;
            left: -20%;
        }

        .tab-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 35px rgba(255,255,255,0.3);
        }

        .home-tab { background: linear-gradient(135deg, #007bff, #00b4ff); }
        .chat-tab { background: linear-gradient(135deg, #ff9800, #ff6f00); }
        .sos-tab { background: linear-gradient(135deg, #ff2e63, #ff0055); }

        .tab-btn:active {
            transform: scale(0.97);
            box-shadow: 0 0 45px white;
        }

        footer {
            position: absolute;
            bottom: 15px;
            font-size: 16px;
            color: rgba(255,255,255,0.4);
        }

        /* Pulse ring animation */
        .pulse-ring {
            position: absolute;
            width: 240px;
            height: 240px;
            border: 2px solid rgba(0,229,255,0.6);
            border-radius: 50%;
            animation: pulseRing 2.5s infinite;
            z-index: -1;
        }

        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .tab-btn { font-size: 20px; padding: 20px; }
        }

    </style>
</head>
<body>
    <div class="pulse-ring"></div>
    <h1>Safety App</h1>
    <div class="tab-container">
        <a href="{% url 'safety:home_tab' %}" class="tab-btn home-tab">Home</a>
        <a href="{% url 'safety:secret_chat' %}" class="tab-btn chat-tab">Secret Chat</a>
        <a href="{% url 'safety:sos_tab' %}" class="tab-btn sos-tab">SOS</a>
    </div>
    <footer>Stay safe, stay connected 💙</footer>
</body>
</html>
