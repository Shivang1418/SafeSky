{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter Info</title>
</head>
<body>
    <h1>Enter Info</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Name:</label>
        <input type="text" name="name" required><br><br>
        <label>Number:</label>
        <input type="text" name="number" required><br><br>
        <button type="submit">Continue</button>
        <input type="email">
        <input type="location">
        
    </form>
</body>
</html>
