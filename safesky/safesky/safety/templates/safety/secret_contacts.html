{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Secret Contacts</title>
    <link rel="stylesheet" href="{% static 'safety/secret_chat.css' %}">
</head>
<body>
<h2>Secret Contacts</h2>

<div id="contact-list"></div>

<form id="add-contact-form">
    <input type="text" id="username" placeholder="Enter username" required>
    <button type="submit">Add Contact</button>
</form>

<script>
// Fetch contacts
function loadContacts() {
    fetch('/safety/api/contacts/')
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById('contact-list');
            list.innerHTML = '';
            data.contacts.forEach(c => {
                const div = document.createElement('div');
                div.innerHTML = `<a href="/safety/secret-chat/${c.contact_id}/">${c.name}</a>`;
                list.appendChild(div);
            });
        });
}
loadContacts();

// Add contact
document.getElementById('add-contact-form').addEventListener('submit', e => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    fetch('/safety/api/contacts/add/', {
        method: 'POST',
        body: JSON.stringify({ username }),
        headers: { 'Content-Type': 'application/json' }
    }).then(() => loadContacts());
});
</script>
</body>
</html>
